# 控制是否以及如何将依赖项添加到默认目录中
catalogMode: prefer

# 是否忽略向工作区根目录添加依赖时的警告提示
ignoreWorkspaceRootCheck: true

# npm 包注册表的基本 URL（包括尾部斜杠）
registry: https://registry.npmmirror.com

minimumReleaseAge: 0

# 是否强制提升所有依赖
shamefullyHoist: true

# 在执行脚本时使用POSIX shell模拟器替代系统原生shell
shellEmulator: true

# 用于控制是否严格检查对等依赖（peer dependencies）的版本一致性。
# 当设置为 true 时，pnpm 会强制安装指定版本的对等依赖；
# 设置为 false 时，会忽略版本不一致的警告
strictPeerDependencies: false

# 当设置为“禁止降级”时，如果软件包的信任级别较之前的版本有所降低，pnpm 将无法安装
trustPolicy: no-downgrade

# 列出一个或多个 pnpm 应该允许安装的特定软件包或版本，即使这些软件包不满足信任策略要求。
trustPolicyExclude:
  - semver
  - chokidar
  - cached-factory

catalogs:
  dev:
    '@lincy/unocss-base-config': ^2.7.4
    consola: ^3.4.2
    mockjs: ^1.1.0
    postcss-px-to-viewport-8-plugin: ^1.2.5
    sass-embedded: ^1.100.0
    stylelint: ^17.14.0
    typescript: ^6.0.3
    vite: ^7.3.6
    vue-tsc: ^3.3.7
  icons:
    '@iconify-json/carbon': ^1.2.24
    '@iconify-json/twemoji': ^1.2.5
  lint:
    '@lincy/eslint-config': ^7.2.0
    '@lincy/stylelint-config': ^2.2.3
    '@unocss/eslint-config': ^66.7.5
    eslint: ^10.6.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.0.8
  nuxt:
    '@element-plus/nuxt': ^1.1.5
    '@nuxt/image': ^2.0.0
    '@nuxt/kit': ^4.4.8
    '@nuxtjs/color-mode': ^4.0.1
    '@pinia/nuxt': ^0.11.3
    '@unocss/nuxt': ^66.7.5
    '@vite-pwa/nuxt': ^1.1.1
    '@vue-macros/nuxt': ^3.1.2
    '@vueuse/nuxt': ^14.3.0
    nuxt: ^4.4.8
  prod:
    '@lincy/async-validation': ^1.4.0
    '@lincy/utils': ^0.7.3
    '@tato30/vue-pdf': ^2.1.0
    better-sqlite3: ^12.11.1
    element-plus: ^2.14.2
    markdown-it-link-attributes: ^4.0.1
    md-editor-v3: ^6.5.3
    md5: ^2.3.0
    pinia: ^3.0.4
    store2: ^2.14.4
  types:
    '@types/markdown-it-link-attributes': ^3.0.5
    '@types/md5': ^2.3.6
    '@types/mockjs': ^1.0.10

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - vue-demi

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  oxc-resolver: true
  sharp: true
